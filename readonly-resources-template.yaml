AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for read-only access to AWS resources'

Resources:
  # IAM Role with read-only access
  ReadOnlyRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/ReadOnlyAccess'
      Path: '/'

  # Instance Profile for EC2 instances
  ReadOnlyInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Path: '/'
      Roles:
        - !Ref ReadOnlyRole

Outputs:
  ReadOnlyRoleARN:
    Description: ARN of the read-only IAM role
    Value: !GetAtt ReadOnlyRole.Arn
  StackName:
    Description: Name of the CloudFormation stack
    Value: !Ref 'AWS::StackName'